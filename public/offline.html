<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Nexa LMS</title>
<style>
  :root { color-scheme: light dark; --fg: #1b2a41; --muted: #6b7280; --bg: #fafaf9; --card: #fff; --line: #e5e7eb; --accent: #c16e48; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e5e7eb; --muted: #9ca3af; --bg: #111418; --card: #1a1f26; --line: #2a313b; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); }
  main { max-width: 560px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 24px; }
  ul { list-style: none; padding: 0; margin: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
  li + li { border-top: 1px solid var(--line); }
  a { display: block; padding: 14px 16px; color: var(--fg); text-decoration: none; }
  a:hover, a:focus-visible { background: color-mix(in srgb, var(--accent) 8%, transparent); outline: none; }
  small { display: block; color: var(--muted); font-size: 13px; }
  button { margin-top: 24px; font: inherit; padding: 10px 16px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>You're offline</h1>
  <p id="lead">This page needs a connection. Lessons you saved for offline are below.</p>
  <ul id="saved" hidden></ul>
  <p id="none" hidden>You haven't saved any lessons yet. Next time you're online, open a lesson and choose "Save for offline".</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
<script>
  (function () {
    var list = document.getElementById("saved");
    var none = document.getElementById("none");
    if (!("serviceWorker" in navigator) || !navigator.serviceWorker.controller) { none.hidden = false; return; }
    var ch = new MessageChannel();
    ch.port1.onmessage = function (e) {
      var lessons = (e.data && e.data.lessons) || [];
      if (!lessons.length) { none.hidden = false; return; }
      lessons.sort(function (a, b) { return (b.savedAt || "").localeCompare(a.savedAt || ""); });
      lessons.forEach(function (l) {
        var li = document.createElement("li");
        var a = document.createElement("a");
        a.href = l.url;
        a.textContent = l.title || l.url;
        var s = document.createElement("small");
        s.textContent = l.savedAt ? "Saved " + new Date(l.savedAt).toLocaleDateString("en-ZA", { day: "numeric", month: "long" }) : "";
        a.appendChild(s);
        li.appendChild(a);
        list.appendChild(li);
      });
      list.hidden = false;
    };
    navigator.serviceWorker.controller.postMessage({ type: "list" }, [ch.port2]);
  })();
</script>
</body>
</html>
